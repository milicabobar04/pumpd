  /worker/members/{memberId}/membership:
    get:
      summary: Pregled statusa članarine (SU-48)
      description: >
        isActive se računa: true dok validUntil nije prošao (članarina koja ističe danas je aktivna).
        404 ako član ne postoji ili nema članarinu.
      tags: [ Zaposleni ]
      parameters:
        - name: memberId
