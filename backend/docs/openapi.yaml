openapi: 3.0.3
info:
  title: Pumpd API
  version: 1.0.0
  description: |
    Zvanična API specifikacija za Pumpd aplikaciju zasnovana na ugovoru.

    Opšta pravila (backend, Faza 2):
    - 401: token nedostaje, nije validan ili pripada obrisanom nalogu. 403: korisnik nema ulogu za rutu.
    - Brisanje naloga je meko: obrisan nalog se ne može prijaviti, ne pojavljuje se u listama,
      a rute za njega vraćaju 404. Email obrisanog naloga se oslobađa za novi nalog.
    - Decimalni broj u cjelobrojnom polju (npr. "grade": 4.5) daje 400, ne skraćuje se.
    - averageGrade je svuda zaokružen na jednu decimalu.
    - Greške su u formatu ErrorResponse; message navodi polje koje nije ispravno.
    - Seed nalozi (admin@, radnik@, trener1-3@, clan1-5@pumpd.local) imaju lozinku pumpd123.
    - Nalog koji pravi radnik ili administrator dobija privremenu lozinku od servera (temporaryPassword);
      prijava i profil vraćaju mustChangePassword: true dok je korisnik ne promijeni (PUT /users/my-password).
    - Slike objava: trener prvo pošalje sliku (POST /posts/images), pa njen imageUrl stavi u POST /posts.
      Slike su javne (GET /images/{imageName}).

servers:
  - url: http://localhost:8080/api 
    description: Lokalni razvojni server

security:
  - bearerAuth: [] 

paths:
  # ==========================================
  # 1. Autentifikacija
  # ==========================================
  /auth/login:
    post:
      summary: Prijava na sistem (SU-03) 
      security: [] # Javno
      tags: [ Autentifikacija ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Uspješna prijava 
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  email: { type: string }
                  role: { type: string, enum: [MEMBER, TRAINER, WORKER, ADMIN] }
                  token: { type: string }
                  mustChangePassword:
                    type: boolean
                    description: true dok korisnik ne promijeni privremenu lozinku (PUT /users/my-password)
        '401':
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      summary: Odjava sa sistema (SU-04) 
      tags: [ Autentifikacija ]
      responses:
        '200':
          description: Uspješna odjava
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ==========================================
  # 2. Nalog i profil
  # ==========================================
  /users/my-profile:
    get:
      summary: Pregled sopstvenog naloga (SU-06) 
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Podaci o nalogu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Uređivanje naloga (SU-08) 
      tags: [ Nalog i profil ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                surname: { type: string }
                birthYear: { type: integer, nullable: true }
                weight: { type: number, nullable: true }
                height: { type: number, nullable: true }
      responses:
        '200':
          description: Uspješno uređivanje
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /users/my-password:
    put:
      summary: Promjena sopstvene lozinke
      description: >
        Za sve prijavljene korisnike. Nakon uspjeha mustChangePassword postaje false.
        Pogrešna stara lozinka daje 400 (ne 401, da aplikacija ne odjavi korisnika).
        Ostali uređaji se ne odjavljuju.
      tags: [ Nalog i profil ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Lozinka promijenjena
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: >
            Polje nedostaje, nova lozinka nema 8–72 znaka, stara lozinka nije ispravna
            ili je nova ista kao stara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /membership/my-status:
    get:
      summary: Pregled podataka o članarini (SU-09)
      description: >
        Samo MEMBER. isActive je true dok validUntil nije prošao (članarina koja ističe danas je aktivna).
        404 ako prijavljeni član nema članarinu.
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Status članarine
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentDate: { type: string, format: date }
                  validUntil: { type: string, format: date }
                  price: { type: number }
                  isActive: { type: boolean }
                  qrCodeUrl:
                    type: string
                    description: >
                      QR kod člana kao PNG slika u obliku data URL-a
                      (data:image/png;base64,...); aplikacija ga prikazuje direktno kao izvor slike.
                    example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        '404':
          $ref: '#/components/responses/Error'

  /users/training-history:
    get:
      summary: Pregled prethodnih treninga (SU-24) 
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Lista treninga
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    trainingId: { type: integer }
                    name: { type: string }
                    date: { type: string, format: date }
                    type: { type: string, enum: [SOLO, GROUP] }

  # ==========================================
  # 3. Planovi treninga
  # ==========================================
  /training-plans:
    get:
      summary: Pregled planova treninga (SU-21) 
      description: >
        Samo MEMBER i TRAINER. Vraća planove kojima je prijavljeni korisnik vlasnik
        (koje je sam kreirao), najnoviji prvi.
      tags: [ Planovi treninga ]
      responses:
        '200':
          description: Lista planova
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    planId: { type: integer }
                    name: { type: string }
                    description: { type: string, nullable: true }
                    durationMinutes: { type: integer }
    post:
      summary: Kreiranje plana treninga (SU-23) 
      description: >
        Samo MEMBER i TRAINER; vlasnik plana je prijavljeni korisnik. Plan mora imati bar jednu vježbu.
        exerciseId se ne šalje (dodjeljuje ga server). Prazan description se čuva kao null.
        400 za nedostajuće ili neispravne podatke.
      tags: [ Planovi treninga ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, durationMinutes, exercises ]
              properties:
                name: { type: string, maxLength: 45 }
                description: { type: string, nullable: true, maxLength: 500 }
                durationMinutes: { type: integer, minimum: 1, maximum: 600 }
                exercises:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [ name, numSets, numRepetitions ]
                    properties:
                      name: { type: string, maxLength: 45 }
                      numSets: { type: integer, minimum: 1, maximum: 100 }
                      numRepetitions: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '201':
          description: Plan kreiran
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: integer }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /training-plans/{planId}:
    get:
      summary: Pregled plana (SU-22) 
      description: >
        Samo vlasnik plana. Vježbe su u redoslijedu dodavanja. 403 ako plan pripada drugom
        korisniku, 404 ako plan ne postoji.
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji plana
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: integer }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  durationMinutes: { type: integer }
                  exercises:
                    type: array
                    items:
                      type: object
                      properties:
                        exerciseId: { type: integer }
                        name: { type: string }
                        numSets: { type: integer }
                        numRepetitions: { type: integer }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Uređivanje plana treninga (SU-25) 
      description: >
        Samo vlasnik plana. Šalje se cijeli plan; lista exercises postaje nova lista vježbi:
        vježba sa exerciseId se mijenja, vježba bez exerciseId se dodaje, a vježba plana koje
        nema u listi se briše. Ista pravila validacije kao pri kreiranju.
        400 ako exerciseId ne pripada ovom planu ili se ponavlja. 403 ako plan pripada
        drugom korisniku, 404 ako plan ne postoji.
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, durationMinutes, exercises ]
              properties:
                name: { type: string, maxLength: 45 }
                description: { type: string, nullable: true, maxLength: 500 }
                durationMinutes: { type: integer, minimum: 1, maximum: 600 }
                exercises:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [ name, numSets, numRepetitions ]
                    properties:
                      exerciseId: { type: integer, nullable: true }
                      name: { type: string, maxLength: 45 }
                      numSets: { type: integer, minimum: 1, maximum: 100 }
                      numRepetitions: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Uspješno uređeno
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Brisanje plana treninga (SU-26) 
      description: >
        Samo vlasnik plana. Plan se briše zajedno sa svojim vježbama.
        403 ako plan pripada drugom korisniku, 404 ako plan ne postoji.
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan obrisan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  # ==========================================
  # 4. Prijave problema
  # ==========================================
  /issues:
    post:
      summary: Prijava problema (SU-01) 
      security:
        - {}
        - bearerAuth: []
      tags: [ Prijave problema ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Uspješno kreirano
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: integer }
                  status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                  message: { type: string }

  /admin/issues:
    get:
      summary: Pregled prijavljenih problema (SU-59)
      description: Najnoviji problemi prvi. Bez parametra status vraća sve probleme.
      tags: [ Prijave problema ]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [UNPROCESSED, IN_PROGRESS, PROCESSED]
      responses:
        '200':
          description: Lista problema (prazan niz ako nema problema)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    issueId: { type: integer }
                    title: { type: string }
                    description: { type: string }
                    status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                    reportDate: { type: string, format: date }
        '400':
          description: Nepoznata vrijednost parametra status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/issues/{issueId}:
    patch:
      summary: Obrada prijavljenog problema (SU-59)
      description: >
        Administrator koji promijeni status postaje onaj koji je (zadnji) obradio problem.
        Slanje istog statusa koji problem već ima nije greška.
      tags: [ Prijave problema ]
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
      responses:
        '200':
          description: Problem obrađen
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: integer }
                  status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                  message: { type: string }
        '400':
          description: Status nedostaje ili nije jedna od dozvoljenih vrijednosti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Problem ne postoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # 5. Teretana
  # ==========================================
  /gym/info:
    get:
      summary: Pregled informacija o teretani (SU-02)
      security: []
      tags: [ Teretana ]
      responses:
        '200':
          description: Podaci o teretani
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymInfo'
    put:
      summary: Uređivanje informacija o teretani (SU-50)
      description: >
        Sva polja su obavezna. Datum osnivanja ne smije biti u budućnosti.
        Ostali podaci o teretani (adresa, vlasnik, kontakt, kapacitet) se ne mijenjaju.
      tags: [ Teretana ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInfoUpdate'
      responses:
        '200':
          description: Informacije uređene
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Unesene informacije nisu validne (alternativni tok 5a)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /gym/occupancy:
    get:
      summary: Pregled zauzetosti teretane (SU-10)
      description: >
        Svaki prijavljeni korisnik. currentMembers je broj članova kojima je danas evidentiran
        ulazak (11.8), a još nije izlazak (11.9). capacity je kapacitet iz informacija o teretani
        (null ako nije unesen).
      tags: [ Teretana ]
      responses:
        '200':
          description: Zauzetost
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentMembers: { type: integer }
                  capacity: { type: integer, nullable: true }

  # ==========================================
  # 6. Obavještenja
  # ==========================================
  /notifications:
    get:
      summary: Pregled obavještenja (SU-05) 
      tags: [ Obavještenja ]
      responses:
        '200':
          description: Lista obavještenja
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notificationId: { type: integer }
                    content: { type: string }
                    date: { type: string, format: date-time }
                    isSeen: { type: boolean }

  /notifications/read-all:
    patch:
      summary: Označavanje svih obavještenja kao pročitanih
      description: >
        Sva obavještenja prijavljenog korisnika postaju pročitana (isSeen: true). Ako nema
        nepročitanih, odgovor je i dalje 200. Tijelo zahtjeva je prazno.
      tags: [ Obavještenja ]
      responses:
        '200':
          description: Obavještenja označena kao pročitana
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      summary: Označavanje jednog obavještenja kao pročitanog
      description: >
        Jedno obavještenje prijavljenog korisnika postaje pročitano. Već pročitano nije greška.
        Tijelo zahtjeva je prazno.
      tags: [ Obavještenja ]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Obavještenje označeno kao pročitano
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: notificationId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Obavještenje ne postoji ili pripada drugom korisniku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # 7. Treneri, praćenje i recenzije
  # ==========================================
  /trainers:
    get:
      summary: Pregled svih naloga trenera (SU-11)
      description: >
        Aktivni treneri, sortirani po prezimenu pa imenu. averageGrade je zaokružen na
        jednu decimalu, a null ako trener nema recenzija.
      tags: [ Treneri ]
      responses:
        '200':
          description: Lista trenera (prazan niz ako nema trenera)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    trainerId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
                    averageGrade: { type: number, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trainers/{trainerId}:
    get:
      summary: Pregled naloga trenera (SU-12)
      description: >
        followStatus je odnos prijavljenog člana i trenera. Odbijen zahtjev za praćenje
        se prikazuje kao NONE (član može poslati novi zahtjev). Recenzije su od najnovije,
        a uključene su i recenzije obrisanih članova.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji trenera
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainerId: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  biography: { type: string, nullable: true }
                  averageGrade: { type: number, nullable: true }
                  followStatus: { type: string, enum: [NONE, PENDING, ACCEPTED] }
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainers/{trainerId}/follow:
    post:
      summary: Slanje zahtjeva za praćenje naloga trenera (SU-13)
      description: >
        Ako je trener ranije odbio zahtjev, novi zahtjev koristi isti red i vraća isti
        followRequestId. Trener dobija obavještenje.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Zahtjev poslat
          content:
            application/json:
              schema:
                type: object
                properties:
                  followRequestId: { type: integer }
                  status: { type: string, enum: [PENDING] }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zahtjev već čeka ili član već prati trenera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Prekid praćenja naloga trenera (SU-15)
      description: >
        Briše aktivno praćenje ("Pracenje je prekinuto.") ili povlači zahtjev koji još čeka
        ("Zahtjev za pracenje je povucen.").
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Praćenje prekinuto ili zahtjev povučen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Član ne prati trenera i nema zahtjev koji čeka (odbijen zahtjev se ne briše)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainers/{trainerId}/reviews:
    post:
      summary: Ostavljanje recenzije treneru (SU-14)
      description: >
        Član ima najviše jednu recenziju po treneru. Ponovna recenzija istog člana zamjenjuje
        staru (isti reviewId, i dalje 201, poruka "Recenzija je azurirana."). Praćenje trenera
        nije uslov. Trener dobija obavještenje sa ocjenom. averageGrade u odgovoru je novi
        prosjek, zaokružen na jednu decimalu.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201':
          description: Recenzija sačuvana (nova ili zamijenjena)
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewId: { type: integer }
                  averageGrade: { type: number }
                  message: { type: string }
        '400':
          description: Ocjena nedostaje, van opsega 1–5 ili nije cijeli broj; komentar duži od 500 znakova
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Istovremeno slanje dvije recenzije (dvostruki klik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainer/reviews:
    get:
      summary: Pregled recenzija (SU-07)
      description: Recenzije prijavljenog trenera, od najnovije. averageGrade je null ako nema recenzija.
      tags: [ Treneri ]
      responses:
        '200':
          description: Recenzije trenera
          content:
            application/json:
              schema:
                type: object
                properties:
                  averageGrade: { type: number, nullable: true }
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # 8. Objave
  # ==========================================
  /posts/feed:
    get:
      summary: Pregled personalizovane stranice (SU-16)
      description: >
        Objave aktivnih trenera koje član prati (samo prihvaćeno praćenje; zahtjev koji čeka ili je
        odbijen ne daje objave), od najnovije. isSaved pokazuje da li je prijavljeni član objavu sačuvao.
        Bez paginacije.
      tags: [ Objave ]
      responses:
        '200':
          description: Feed objava (prazan niz ako nema objava)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /posts/{postId}/save:
    post:
      summary: Čuvanje objave (SU-17)
      description: >
        Član može sačuvati objavu bilo kog aktivnog trenera (praćenje nije uslov).
        Tijelo zahtjeva je prazno.
      tags: [ Objave ]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objava sačuvana
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: postId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Objava ne postoji ili je njen trener obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Objava je već sačuvana (i kod istovremenog dvostrukog klika)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Brisanje sačuvane objave (SU-28)
      description: >
        Uklanja objavu iz sačuvanih. Radi i ako je trener u međuvremenu obrisan
        (npr. kad aplikacija još prikazuje staru listu).
      tags: [ Objave ]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objava uklonjena iz sačuvanih
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: postId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Objava nije u sačuvanim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/saved:
    get:
      summary: Pregled sačuvanih objava (SU-27)
      description: >
        Sačuvane objave člana, od zadnje sačuvane (datum čuvanja je bez vremena, pa se za isti dan
        redaju po vremenu objave). isSaved je uvijek true. Objava ostaje i nakon prekida praćenja,
        a ne prikazuju se objave obrisanih trenera ni objave koje je trener obrisao.
      tags: [ Objave ]
      responses:
        '200':
          description: Lista sačuvanih objava (prazan niz ako nema)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /posts/my-posts:
    get:
      summary: Pregled sopstvenih objava (SU-29)
      description: Objave prijavljenog trenera, od najnovije.
      tags: [ Objave ]
      responses:
        '200':
          description: Objave trenera (prazan niz ako nema)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    postId: { type: integer }
                    content: { type: string }
                    imageUrl: { type: string, nullable: true }
                    postTimestamp: { type: string, format: date-time, example: '2026-11-22T10:30:15' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /posts:
    post:
      summary: Dodavanje objave (SU-30)
      description: >
        Vrijeme objave postavlja server (na sekunde). imageUrl je opcion; ako je poslat, mora biti
        adresa koju je vratio POST /posts/images (slika mora postojati). Vanjski linkovi se ne primaju.
      tags: [ Objave ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 500 }
                imageUrl: { type: string, nullable: true, maxLength: 255, example: '/api/images/7f3c9a2e-41b8-4d2a-9c11-5e8a0b6d2f44.jpg' }
      responses:
        '201':
          description: Objava dodata
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId: { type: integer }
                  message: { type: string }
        '400':
          description: Prazan sadržaj, sadržaj duži od 500 znakova, ili slika koja nije poslata preko /posts/images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /posts/images:
    post:
      summary: Slanje slike za objavu
      description: >
        Samo trener. Slika se šalje kao multipart/form-data u polju "image". Dozvoljeni su JPEG, PNG i WebP
        (format se provjerava po sadržaju fajla, ne po imenu), najviše 5 MB. Server sliku čuva pod
        nasumičnim imenom i vraća imageUrl, koji se zatim šalje u POST /posts. imageUrl je adresa
        od korijena servera (počinje sa /api/images/), pa joj aplikacija dodaje adresu servera.
        Aplikacija treba provjeriti veličinu prije slanja (ili smanjiti kvalitet slike): za fajlove
        veće od oko 16 MB server zatvara vezu, pa klijent ne dobije odgovor 400.
      tags: [ Objave ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Slika sačuvana
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl: { type: string, example: '/api/images/7f3c9a2e-41b8-4d2a-9c11-5e8a0b6d2f44.jpg' }
        '400':
          description: Nema polja image, zahtjev nije multipart, slika je prazna, nije JPEG/PNG/WebP ili je veća od 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /posts/{postId}:
    delete:
      summary: Brisanje sopstvene objave (SU-31)
      description: >
        Trajno brisanje: briše se i iz sačuvanih objava svih članova, a fajl slike se briše sa servera.
      tags: [ Objave ]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objava obrisana
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: postId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token nedostaje, nije validan ili pripada obrisanom nalogu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Korisnik nije trener ili objava pripada drugom treneru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Objava ne postoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/{imageName}:
    get:
      summary: Slika objave
      description: >
        Javno (bez tokena): ime je nasumično (UUID) i do njega se dolazi samo preko zaštićenih ruta.
        Odgovor se smije keširati godinu dana, jer se sadržaj pod istim imenom ne mijenja.
      security: []
      tags: [ Objave ]
      parameters:
        - name: imageName
          in: path
          required: true
          schema:
            type: string
            example: 7f3c9a2e-41b8-4d2a-9c11-5e8a0b6d2f44.jpg
      responses:
        '200':
          description: Sadržaj slike
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Slika ne postoji ili ime nije ispravno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # 9. Grupni treninzi – pregled i prijava
  # ==========================================
  /group-trainings:
    get:
      summary: Pregled termina grupnih treninga (SU-18, SU-43) 
      tags: [ Grupni treninzi ]
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: trainerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista termina
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionId: { type: integer }
                    groupId: { type: integer }
                    name: { type: string }
                    trainerId: { type: integer }
                    trainerName: { type: string }
                    startTime: { type: string, format: date-time }
                    durationMinutes: { type: integer }
                    enrolledCount: { type: integer }
                    maxMembers: { type: integer }
                    enrollmentStatus: { type: string, enum: [NONE, PENDING, ACCEPTED, REJECTED] }

  /group-trainings/{sessionId}/enrollment:
    post:
      summary: Slanje zahtjeva za prijavu na termin (SU-19) 
      tags: [ Grupni treninzi ]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Zahtjev poslat
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: integer }
                  status: { type: string, enum: [PENDING] }
                  message: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Odjava sa termina (SU-20) 
      tags: [ Grupni treninzi ]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Odjava uspješna
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          $ref: '#/components/responses/Error'

  # ==========================================
  # 10. Trener – praćenje, termini i grupe
  # ==========================================
  /trainer/follow-requests:
    get:
      summary: Pregled zahtjeva za praćenje (SU-32)
      description: Zahtjevi koji čekaju prijavljenog trenera, najstariji prvi, bez obrisanih članova.
      tags: [ Trener ]
      responses:
        '200':
          description: Lista zahtjeva (prazan niz ako nema zahtjeva)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    requestId: { type: integer }
                    memberId: { type: integer }
                    memberName: { type: string }
                    requestDate: { type: string, format: date }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trainer/follow-requests/{requestId}:
    patch:
      summary: Upravljanje zahtjevom za praćenje (SU-33)
      description: >
        Trener obrađuje samo zahtjeve upućene njemu. Član dobija obavještenje o odluci.
        Odbijen zahtjev ostaje zapisan, a član može poslati novi.
      tags: [ Trener ]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Zahtjev obrađen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Status nedostaje ili nije ACCEPTED/REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Zahtjev ne postoji, upućen je drugom treneru ili je član obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zahtjev je već obrađen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainer/followers:
    get:
      summary: Pregled članova koji prate trenera (SU-60)
      description: Prihvaćeni pratioci prijavljenog trenera, sortirani po prezimenu pa imenu, bez obrisanih članova.
      tags: [ Trener ]
      responses:
        '200':
          description: Lista pratilaca (prazan niz ako nema pratilaca)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    memberId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trainer/schedule:
    get:
      summary: Pregled dnevnog rasporeda (SU-36) 
      description: >
        Samo TRAINER. Termini prijavljenog trenera za dati dan (date = 2026-11-20; bez njega danas),
        po vremenu početka. startTime je lokalno vrijeme bez zone. enrolledCount je broj članova grupe.
        400 za neispravan datum.
      tags: [ Trener ]
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dnevni raspored
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionId: { type: integer }
                    name: { type: string }
                    startTime: { type: string, format: date-time }
                    durationMinutes: { type: integer }
                    enrolledCount: { type: integer }
                    maxMembers: { type: integer }

  /trainer/group-trainings:
    post:
      summary: Dodavanje termina (SU-35) 
      description: >
        Samo TRAINER. Pravi termin i njegovu grupu. 400 ako startTime nije u budućnosti ili su
        podaci neispravni. 409 ako se preklapa sa drugim terminom istog trenera
        (termin koji počinje tačno kad prethodni završi je dozvoljen).
      tags: [ Trener ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, startTime, durationMinutes, maxMembers ]
              properties:
                name: { type: string, maxLength: 45 }
                startTime: { type: string, format: date-time, example: '2026-11-20T18:00:00' }
                durationMinutes: { type: integer, minimum: 15, maximum: 300 }
                maxMembers: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201':
          description: Termin dodat
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: integer }
                  groupId: { type: integer }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /trainer/group-trainings/{sessionId}:
    put:
      summary: Uređivanje termina grupnih treninga (SU-40) 
      description: >
        Samo vlasnik termina. 400 ako je termin već počeo ili novi startTime nije u budućnosti.
        403 za tuđi termin, 404 ako ne postoji. 409 za preklapanje ili ako je maxMembers manji
        od broja članova grupe. Ako se promijeni vrijeme ili trajanje, članovi grupe dobijaju obavještenje.
      tags: [ Trener ]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, startTime, durationMinutes, maxMembers ]
              properties:
                name: { type: string, maxLength: 45 }
                startTime: { type: string, format: date-time, example: '2026-11-20T18:00:00' }
                durationMinutes: { type: integer, minimum: 15, maximum: 300 }
                maxMembers: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Termin uređen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Brisanje termina (SU-37) 
      description: >
        Samo vlasnik termina. Briše termin, njegovu grupu i sve prijave; članovi grupe i oni čiji
        zahtjev čeka dobijaju obavještenje. 403 za tuđi termin, 404 ako ne postoji,
        409 ako je termin već počeo (ostaje u istoriji treninga).
      tags: [ Trener ]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Termin obrisan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /trainer/groups:
    get:
      summary: Pregled svih grupa (SU-34) 
      description: >
        Samo TRAINER. Grupe prijavljenog trenera (svaka pripada jednom terminu): prvo predstojeći
        termini (najbliži prvi), pa prošli (najnoviji prvi). memberCount je broj članova grupe.
      tags: [ Trener ]
      responses:
        '200':
          description: Lista grupa
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    groupId: { type: integer }
                    sessionId: { type: integer }
                    name: { type: string }
                    startTime: { type: string, format: date-time }
                    memberCount: { type: integer }
                    maxMembers: { type: integer }

  /trainer/groups/{groupId}/members:
    get:
      summary: Pregled svih članova grupe (SU-38) 
      description: >
        Samo vlasnik grupe. Članovi po prezimenu i imenu, bez obrisanih naloga.
        403 za tuđu grupu, 404 ako grupa ne postoji.
      tags: [ Trener ]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Članovi grupe
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    memberId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Dodavanje člana u grupu (SU-60) 
      description: >
        Samo vlasnik grupe. Član se bira iz liste pratilaca (10.3) i upisuje se i u grupu i u termin
        (enrollmentStatus postaje ACCEPTED; zahtjev koji čeka se prihvata). Član dobija obavještenje.
        400 ako član nije aktivan pratilac trenera, 403 za tuđu grupu, 404 ako grupa ili član ne postoji,
        409 ako je član već u grupi, grupa je puna ili je termin već počeo.
      tags: [ Trener ]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ memberId ]
              properties:
                memberId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Član dodat u grupu
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /trainer/groups/{groupId}/members/{memberId}:
    delete:
      summary: Uklanjanje člana iz grupe (SU-39) 
      description: >
        Samo vlasnik grupe. Član se uklanja iz grupe i iz termina (enrollmentStatus postaje NONE,
        pa može ponovo poslati zahtjev) i dobija obavještenje. 403 za tuđu grupu, 404 ako grupa
        ne postoji ili član nije u njoj, 409 ako je termin već počeo.
      tags: [ Trener ]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Član uklonjen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /trainer/group-requests:
    get:
      summary: Pregled zahtjeva za grupne treninge (SU-41) 
      tags: [ Trener ]
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista zahtjeva
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    requestId: { type: integer }
                    memberId: { type: integer }
                    memberName: { type: string }
                    sessionId: { type: integer }
                    sessionName: { type: string }
                    startTime: { type: string, format: date-time }
                    enrolledCount: { type: integer }
                    maxMembers: { type: integer }
                    requestDate: { type: string, format: date }

  /trainer/group-requests/{requestId}:
    patch:
      summary: Upravljanje zahtjevima za grupne treninge (SU-42) 
      tags: [ Trener ]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Zahtjev obrađen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  # ==========================================
  # 11. Zaposleni – upravljanje članovima
  # ==========================================
  /worker/members:
    get:
      summary: Pregled svih članova (SU-44)
      description: >
        Aktivni članovi, sortirani po prezimenu pa imenu. search traži po imenu, prezimenu,
        emailu ili punom imenu ("Amar Hod"), bez obzira na velika i mala slova; prazan search
        vraća sve. Članarina koja ističe danas je još aktivna.
      tags: [ Zaposleni ]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista članova (prazan niz ako nema članova)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    memberId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
                    email: { type: string }
                    membershipActive: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Dodavanje člana (SU-46)
      description: >
        Uloga novog naloga je uvijek MEMBER. Godina rođenja ne smije biti poslije tekuće godine.
        Lozinku ne šalje radnik: server generiše privremenu i vraća je u odgovoru (temporaryPassword).
      tags: [ Zaposleni ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, surname, email]
              properties:
                name: { type: string, minLength: 1, maxLength: 45 }
                surname: { type: string, minLength: 1, maxLength: 45 }
                email: { type: string, format: email, maxLength: 100 }
                birthYear: { type: integer, nullable: true, minimum: 1900 }
                weight: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 500 }
                height: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 300 }
      responses:
        '201':
          description: Član dodat
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId: { type: integer }
                  temporaryPassword:
                    type: string
                    description: >
                      Privremena lozinka koju je generisao server (12 znakova). Vraća se samo
                      ovdje; korisnik je mora promijeniti nakon prve prijave.
                  message: { type: string }
        '400':
          description: Nevalidni podaci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email već postoji (bez obzira na velika i mala slova)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /worker/members/{memberId}:
