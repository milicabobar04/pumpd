    post:
      summary: Evidencija dolaska skeniranjem QR koda (SU-10)
      description: >
        Samo WORKER. Ako član nema članarinu ili mu je istekla, odgovor je 200 sa isAllowed = false
        i ulazak se ne evidentira (članarina koja ističe danas je aktivna).
        400 ako qrCode nedostaje ili je prazan. 404 ako član sa tim QR kodom ne postoji ili je obrisan.
