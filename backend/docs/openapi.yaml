  /trainer/follow-requests/{requestId}:
    patch:
      summary: Upravljanje zahtjevom za praćenje (SU-33)
      description: >
        Trener obrađuje samo zahtjeve upućene njemu. Član dobija obavještenje o odluci.
        Odbijen zahtjev ostaje zapisan, a član može poslati novi.
      tags: [ Trener ]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Zahtjev obrađen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Status nedostaje ili nije ACCEPTED/REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Zahtjev ne postoji, upućen je drugom treneru ili je član obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zahtjev je već obrađen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

