openapi: 3.0.3
info:
  title: Pumpd API
  version: 1.0.0
  description: |
    Zvanična API specifikacija za Pumpd aplikaciju zasnovana na ugovoru.

    Opšta pravila (backend, Faza 2):
    - 401: token nedostaje, nije validan ili pripada obrisanom nalogu. 403: korisnik nema ulogu za rutu.
    - Brisanje naloga je meko: obrisan nalog se ne može prijaviti, ne pojavljuje se u listama,
      a rute za njega vraćaju 404. Email obrisanog naloga se oslobađa za novi nalog.
    - Decimalni broj u cjelobrojnom polju (npr. "grade": 4.5) daje 400, ne skraćuje se.
    - averageGrade je svuda zaokružen na jednu decimalu.
    - Greške su u formatu ErrorResponse; message navodi polje koje nije ispravno.
    - Seed nalozi (admin@, radnik@, trener1-3@, clan1-5@pumpd.local) imaju lozinku pumpd123.
    - Nalog koji pravi radnik ili administrator dobija privremenu lozinku od servera (temporaryPassword);
      prijava i profil vraćaju mustChangePassword: true dok je korisnik ne promijeni (PUT /users/my-password).

servers:
  - url: http://localhost:8080/api 
    description: Lokalni razvojni server

security:
  - bearerAuth: [] 

paths:
  # ==========================================
  # 1. Autentifikacija
  # ==========================================
  /auth/login:
    post:
      summary: Prijava na sistem (SU-03) 
      security: [] # Javno
      tags: [ Autentifikacija ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Uspješna prijava 
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  email: { type: string }
                  role: { type: string, enum: [MEMBER, TRAINER, WORKER, ADMIN] }
                  token: { type: string }
                  mustChangePassword:
                    type: boolean
                    description: true dok korisnik ne promijeni privremenu lozinku (PUT /users/my-password)
        '401':
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      summary: Odjava sa sistema (SU-04) 
      tags: [ Autentifikacija ]
      responses:
        '200':
          description: Uspješna odjava
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ==========================================
  # 2. Nalog i profil
  # ==========================================
  /users/my-profile:
    get:
      summary: Pregled sopstvenog naloga (SU-06) 
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Podaci o nalogu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Uređivanje naloga (SU-08) 
      tags: [ Nalog i profil ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                surname: { type: string }
                birthYear: { type: integer, nullable: true }
                weight: { type: number, nullable: true }
                height: { type: number, nullable: true }
      responses:
        '200':
          description: Uspješno uređivanje
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /users/my-password:
    put:
      summary: Promjena sopstvene lozinke
      description: >
        Za sve prijavljene korisnike. Nakon uspjeha mustChangePassword postaje false.
        Pogrešna stara lozinka daje 400 (ne 401, da aplikacija ne odjavi korisnika).
        Ostali uređaji se ne odjavljuju.
      tags: [ Nalog i profil ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Lozinka promijenjena
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: >
            Polje nedostaje, nova lozinka nema 8–72 znaka, stara lozinka nije ispravna
            ili je nova ista kao stara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /membership/my-status:
    get:
      summary: Pregled podataka o članarini (SU-09) 
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Status članarine
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentDate: { type: string, format: date }
                  validUntil: { type: string, format: date }
                  price: { type: number }
                  isActive: { type: boolean }
                  qrCodeUrl: { type: string }
        '404':
          $ref: '#/components/responses/Error'

  /users/training-history:
    get:
      summary: Pregled prethodnih treninga (SU-24) 
      tags: [ Nalog i profil ]
      responses:
        '200':
          description: Lista treninga
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    trainingId: { type: integer }
                    name: { type: string }
                    date: { type: string, format: date }
                    type: { type: string, enum: [SOLO, GROUP] }

  # ==========================================
  # 3. Planovi treninga
  # ==========================================
  /training-plans:
    get:
      summary: Pregled planova treninga (SU-21) 
      tags: [ Planovi treninga ]
      responses:
        '200':
          description: Lista planova
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    planId: { type: integer }
                    name: { type: string }
                    description: { type: string, nullable: true }
                    durationMinutes: { type: integer }
    post:
      summary: Kreiranje plana treninga (SU-23) 
      tags: [ Planovi treninga ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                durationMinutes: { type: integer }
                exercises:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      numSets: { type: integer }
                      numRepetitions: { type: integer }
      responses:
        '201':
          description: Plan kreiran
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: integer }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /training-plans/{planId}:
    get:
      summary: Pregled plana (SU-22) 
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji plana
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: integer }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  durationMinutes: { type: integer }
                  exercises:
                    type: array
                    items:
                      type: object
                      properties:
                        exerciseId: { type: integer }
                        name: { type: string }
                        numSets: { type: integer }
                        numRepetitions: { type: integer }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Uređivanje plana treninga (SU-25) 
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                durationMinutes: { type: integer }
                exercises:
                  type: array
                  items:
                    type: object
                    properties:
                      exerciseId: { type: integer, nullable: true }
                      name: { type: string }
                      numSets: { type: integer }
                      numRepetitions: { type: integer }
      responses:
        '200':
          description: Uspješno uređeno
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Brisanje plana treninga (SU-26) 
      tags: [ Planovi treninga ]
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan obrisan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  # ==========================================
  # 4. Prijave problema
  # ==========================================
  /issues:
    post:
      summary: Prijava problema (SU-01) 
      security:
        - {}
        - bearerAuth: []
      tags: [ Prijave problema ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Uspješno kreirano
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: integer }
                  status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                  message: { type: string }

  /admin/issues:
    get:
      summary: Pregled prijavljenih problema (SU-59)
      description: Najnoviji problemi prvi. Bez parametra status vraća sve probleme.
      tags: [ Prijave problema ]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [UNPROCESSED, IN_PROGRESS, PROCESSED]
      responses:
        '200':
          description: Lista problema (prazan niz ako nema problema)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    issueId: { type: integer }
                    title: { type: string }
                    description: { type: string }
                    status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                    reportDate: { type: string, format: date }
        '400':
          description: Nepoznata vrijednost parametra status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/issues/{issueId}:
    patch:
      summary: Obrada prijavljenog problema (SU-59)
      description: >
        Administrator koji promijeni status postaje onaj koji je (zadnji) obradio problem.
        Slanje istog statusa koji problem već ima nije greška.
      tags: [ Prijave problema ]
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
      responses:
        '200':
          description: Problem obrađen
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: integer }
                  status: { type: string, enum: [UNPROCESSED, IN_PROGRESS, PROCESSED] }
                  message: { type: string }
        '400':
          description: Status nedostaje ili nije jedna od dozvoljenih vrijednosti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Problem ne postoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # 5. Teretana
  # ==========================================
  /gym/info:
    get:
      summary: Pregled informacija o teretani (SU-02)
      security: []
      tags: [ Teretana ]
      responses:
        '200':
          description: Podaci o teretani
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymInfo'
    put:
      summary: Uređivanje informacija o teretani (SU-50)
      description: >
        Sva polja su obavezna. Datum osnivanja ne smije biti u budućnosti.
        Ostali podaci o teretani (adresa, vlasnik, kontakt, kapacitet) se ne mijenjaju.
      tags: [ Teretana ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInfoUpdate'
      responses:
        '200':
          description: Informacije uređene
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Unesene informacije nisu validne (alternativni tok 5a)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /gym/occupancy:
    get:
      summary: Pregled zauzetosti teretane (SU-10) 
      tags: [ Teretana ]
      responses:
        '200':
          description: Zauzetost
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentMembers: { type: integer }
                  capacity: { type: integer, nullable: true }

  # ==========================================
  # 6. Obavještenja
  # ==========================================
  /notifications:
    get:
      summary: Pregled obavještenja (SU-05) 
      tags: [ Obavještenja ]
      responses:
        '200':
          description: Lista obavještenja
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notificationId: { type: integer }
                    content: { type: string }
                    date: { type: string, format: date-time }
                    isSeen: { type: boolean }

  # ==========================================
  # 7. Treneri, praćenje i recenzije
  # ==========================================
  /trainers:
    get:
      summary: Pregled svih naloga trenera (SU-11)
      description: >
        Aktivni treneri, sortirani po prezimenu pa imenu. averageGrade je zaokružen na
        jednu decimalu, a null ako trener nema recenzija.
      tags: [ Treneri ]
      responses:
        '200':
          description: Lista trenera (prazan niz ako nema trenera)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    trainerId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
                    averageGrade: { type: number, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trainers/{trainerId}:
    get:
      summary: Pregled naloga trenera (SU-12)
      description: >
        followStatus je odnos prijavljenog člana i trenera. Odbijen zahtjev za praćenje
        se prikazuje kao NONE (član može poslati novi zahtjev). Recenzije su od najnovije,
        a uključene su i recenzije obrisanih članova.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji trenera
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainerId: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  biography: { type: string, nullable: true }
                  averageGrade: { type: number, nullable: true }
                  followStatus: { type: string, enum: [NONE, PENDING, ACCEPTED] }
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainers/{trainerId}/follow:
    post:
      summary: Slanje zahtjeva za praćenje naloga trenera (SU-13)
      description: >
        Ako je trener ranije odbio zahtjev, novi zahtjev koristi isti red i vraća isti
        followRequestId. Trener dobija obavještenje.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Zahtjev poslat
          content:
            application/json:
              schema:
                type: object
                properties:
                  followRequestId: { type: integer }
                  status: { type: string, enum: [PENDING] }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zahtjev već čeka ili član već prati trenera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Prekid praćenja naloga trenera (SU-15)
      description: >
        Briše aktivno praćenje ("Pracenje je prekinuto.") ili povlači zahtjev koji još čeka
        ("Zahtjev za pracenje je povucen.").
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Praćenje prekinuto ili zahtjev povučen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Član ne prati trenera i nema zahtjev koji čeka (odbijen zahtjev se ne briše)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainers/{trainerId}/reviews:
    post:
      summary: Ostavljanje recenzije treneru (SU-14)
      description: >
        Član ima najviše jednu recenziju po treneru. Ponovna recenzija istog člana zamjenjuje
        staru (isti reviewId, i dalje 201, poruka "Recenzija je azurirana."). Praćenje trenera
        nije uslov. Trener dobija obavještenje sa ocjenom. averageGrade u odgovoru je novi
        prosjek, zaokružen na jednu decimalu.
      tags: [ Treneri ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201':
          description: Recenzija sačuvana (nova ili zamijenjena)
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewId: { type: integer }
                  averageGrade: { type: number }
                  message: { type: string }
        '400':
          description: Ocjena nedostaje, van opsega 1–5 ili nije cijeli broj; komentar duži od 500 znakova
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Istovremeno slanje dvije recenzije (dvostruki klik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainer/reviews:
    get:
      summary: Pregled recenzija (SU-07)
      description: Recenzije prijavljenog trenera, od najnovije. averageGrade je null ako nema recenzija.
      tags: [ Treneri ]
      responses:
        '200':
          description: Recenzije trenera
          content:
            application/json:
              schema:
                type: object
                properties:
                  averageGrade: { type: number, nullable: true }
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # 8. Objave
  # ==========================================
  /posts/feed:
    get:
      summary: Pregled personalizovane stranice (SU-16) 
      tags: [ Objave ]
      responses:
        '200':
          description: Feed objava
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/{postId}/save:
    post:
      summary: Čuvanje objave (SU-17) 
      tags: [ Objave ]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objava sačuvana
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Brisanje sačuvane objave (SU-28) 
      tags: [ Objave ]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objava uklonjena iz sačuvanih
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          $ref: '#/components/responses/Error'

  /posts/saved:
    get:
      summary: Pregled sačuvanih objava (SU-27) 
      tags: [ Objave ]
      responses:
        '200':
          description: Lista sačuvanih objava
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/my-posts:
    get:
      summary: Pregled sopstvenih objava (SU-29) 
      tags: [ Objave ]
      responses:
        '200':
          description: Objave trenera
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    postId: { type: integer }
                    content: { type: string }
                    imageUrl: { type: string, nullable: true }
                    postTimestamp: { type: string, format: date-time }

  /posts:
    post:
