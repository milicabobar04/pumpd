      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ numMonths ]
              properties:
                numMonths: { type: integer, minimum: 1, maximum: 24 }
      responses:
        '200':
          description: Članarina produžena
          content:
