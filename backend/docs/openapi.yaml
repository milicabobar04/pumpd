  # ==========================================
  # 11. Zaposleni – upravljanje članovima
  # ==========================================
  /worker/members:
    get:
      summary: Pregled svih članova (SU-44)
      description: >
        Aktivni članovi, sortirani po prezimenu pa imenu. search traži po imenu, prezimenu,
        emailu ili punom imenu ("Amar Hod"), bez obzira na velika i mala slova; prazan search
        vraća sve. Članarina koja ističe danas je još aktivna.
      tags: [ Zaposleni ]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista članova (prazan niz ako nema članova)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    memberId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
                    email: { type: string }
                    membershipActive: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Dodavanje člana (SU-46)
      description: >
        Uloga novog naloga je uvijek MEMBER. Godina rođenja ne smije biti poslije tekuće godine.
        Lozinku ne šalje radnik: server generiše privremenu i vraća je u odgovoru (temporaryPassword).
      tags: [ Zaposleni ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, surname, email]
              properties:
                name: { type: string, minLength: 1, maxLength: 45 }
                surname: { type: string, minLength: 1, maxLength: 45 }
                email: { type: string, format: email, maxLength: 100 }
                birthYear: { type: integer, nullable: true, minimum: 1900 }
                weight: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 500 }
                height: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 300 }
      responses:
        '201':
          description: Član dodat
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId: { type: integer }
                  temporaryPassword:
                    type: string
                    description: >
                      Privremena lozinka koju je generisao server (12 znakova). Vraća se samo
                      ovdje; korisnik je mora promijeniti nakon prve prijave.
                  message: { type: string }
        '400':
          description: Nevalidni podaci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email već postoji (bez obzira na velika i mala slova)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /worker/members/{memberId}:
