  /admin/trainers/{trainerId}:
    get:
      summary: Pregled trenera (SU-52)
      description: >
        averageGrade je zaokružen na jednu decimalu (null ako nema recenzija; uključene su i
        recenzije obrisanih članova). followerCount broji samo prihvaćena praćenja aktivnih članova.
      tags: [ Administrator ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji trenera
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainerId: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  email: { type: string }
                  biography: { type: string, nullable: true }
                  averageGrade: { type: number, nullable: true }
                  followerCount: { type: integer }
        '400':
          description: trainerId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji, obrisan je ili id pripada drugom tipu naloga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Uklanjanje trenera (SU-54)
      description: >
        Meko brisanje: nalog postaje neaktivan (ne može se prijaviti, stari token daje 401, ne pojavljuje se u listama), a email se oslobađa (obrisan-<id>@pumpd.invalid). Podaci vezani za nalog ostaju zbog istorije.
      tags: [ Administrator ]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trener uklonjen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trener ne postoji ili je već obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/workers:
    get:
      summary: Pregled svih radnika (SU-55)
      description: Aktivni radnici bez administratora, sortirani po prezimenu pa imenu.
      tags: [ Administrator ]
      responses:
        '200':
          description: Lista radnika (prazan niz ako nema radnika)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    workerId: { type: integer }
                    name: { type: string }
                    surname: { type: string }
                    email: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Dodavanje radnika (SU-57)
      description: Lozinku generiše server i vraća je u odgovoru (temporaryPassword).
      tags: [ Administrator ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, surname, email]
              properties:
                name: { type: string, minLength: 1, maxLength: 45 }
                surname: { type: string, minLength: 1, maxLength: 45 }
                email: { type: string, format: email, maxLength: 100 }
      responses:
        '201':
          description: Radnik dodat
          content:
            application/json:
              schema:
                type: object
                properties:
                  workerId: { type: integer }
                  temporaryPassword:
                    type: string
                    description: >
                      Privremena lozinka koju je generisao server (12 znakova). Vraća se samo
                      ovdje; korisnik je mora promijeniti nakon prve prijave.
                  message: { type: string }
        '400':
          description: Nevalidni podaci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email već postoji (alternativni tok 4a)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/workers/{workerId}:
    get:
      summary: Pregled radnika (SU-56)
      tags: [ Administrator ]
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji radnika
          content:
            application/json:
              schema:
                type: object
                properties:
                  workerId: { type: integer }
                  name: { type: string }
                  surname: { type: string }
                  email: { type: string }
        '400':
          description: workerId nije broj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Radnik ne postoji, obrisan je ili je id administratora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Uklanjanje radnika (SU-58)
      description: >
        Meko brisanje: nalog postaje neaktivan (ne može se prijaviti, stari token daje 401, ne pojavljuje se u listama), a email se oslobađa (obrisan-<id>@pumpd.invalid). Podaci vezani za nalog ostaju zbog istorije.
      tags: [ Administrator ]
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Radnik uklonjen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Radnik ne postoji ili je već obrisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT 

  schemas:
    # 0. Opšte konvencije
    ErrorResponse:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string } 

    # Reusable schema: Profil (2.1)
    UserProfile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        surname: { type: string }
        email: { type: string }
        birthYear: { type: integer, nullable: true }
        weight: { type: number, nullable: true }
        height: { type: number, nullable: true }
        role: { type: string, enum: [MEMBER, TRAINER, WORKER, ADMIN] }
        mustChangePassword:
          type: boolean
          description: Isto kao u odgovoru prijave; za aplikaciju pokrenutu sa sačuvanim tokenom

    # Reusable schema: Teretana (5.1, 5.2)
    GymInfo:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        membershipPrice: { type: number }
        dateOfEstablishment: { type: string, format: date }
        workingHours: { type: string } 
        
    # Tijelo zahtjeva 5.2: sva polja su obavezna
    GymInfoUpdate:
      type: object
      required: [name, description, membershipPrice, dateOfEstablishment, workingHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 45 }
        description: { type: string, minLength: 1, maxLength: 500 }
        membershipPrice: { type: number, minimum: 0, exclusiveMinimum: true }
        dateOfEstablishment: { type: string, format: date }
        workingHours: { type: string, minLength: 1, maxLength: 45 }

    # Reusable schema: Recenzija (7.2, 7.6); memberName = "Ime Prezime"
    Review:
      type: object
      properties:
        reviewId: { type: integer }
        memberName: { type: string }
        grade: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        date: { type: string, format: date }

    # Reusable schema: Objave (8.1, 8.3)
    Post:
      type: object
      properties:
        postId: { type: integer }
        trainerId: { type: integer }
        trainerName: { type: string }
        content: { type: string }
        imageUrl: { type: string, nullable: true }
        postTimestamp: { type: string, format: date-time }
        isSaved: { type: boolean } 

  responses:
    Error:
      description: Standardni format greške (npr. 400, 401, 403, 404, 409) 
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Token nedostaje, nije validan ili pripada obrisanom nalogu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Korisnik nema ulogu za ovu rutu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
