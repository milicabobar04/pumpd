              schema:
                type: object
                properties:
                  paymentDate: { type: string, format: date }
                  validUntil: { type: string, format: date }
                  price: { type: number }
                  isActive: { type: boolean }
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Uređivanje statusa članarine (SU-49)
      description: >
        Postavlja članarinu članu. Ako član nema članarinu, kreira se.
        400 ako neko polje nedostaje, ako je validUntil prije paymentDate ili je price negativan.
        404 ako član ne postoji.
      tags: [ Zaposleni ]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ paymentDate, validUntil, price ]
              properties:
                paymentDate: { type: string, format: date }
                validUntil: { type: string, format: date }
                price: { type: number, minimum: 0, maximum: 100000 }
      responses:
        '200':
          description: Članarina sačuvana (izmijenjena ili kreirana)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /worker/members/{memberId}/membership/extend:
    post:
      summary: Produženje članarine (SU-49)
      description: >
        Aktivna članarina (uključujući onu koja ističe danas) produžava se od validUntil,
        istekla od današnjeg dana. paymentDate postaje današnji datum, cijena se ne mijenja.
        400 ako numMonths nije cijeli broj od 1 do 24.
        404 ako član ne postoji ili nema članarinu (prvo je treba postaviti preko PUT).
      tags: [ Zaposleni ]
      parameters:
        - name: memberId
          in: path
