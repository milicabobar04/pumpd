# Profil za server za predaju: pokretanje sa SPRING_PROFILES_ACTIVE=prod.
# Ovdje nema podrazumijevanih vrijednosti za tajne i bazu; ako nešto nije postavljeno, server se ne
# pokreće i ispiše šta nedostaje (config/ProdukcijskaProvjera).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Ključ: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}

# Trajni folder za slike objava (apsolutna putanja ili Docker volume), sa pravom pisanja.
pumpd.slike.folder=${SLIKE_FOLDER:}

# Greške bez detalja servera (stack trace i poruke izuzetaka se ne šalju klijentu).
server.error.include-stacktrace=never
server.error.include-message=never
