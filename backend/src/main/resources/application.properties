spring.application.name=backend
spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb_test?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# JWT - HS256 kljuc (Base64, min 256 bita). U produkciji obavezno postaviti JWT_SECRET.
jwt.secret=${JWT_SECRET:CgQjUrqARTGnaq7/JWnCUsnbfPkUn66hTYqmmnGnzHQ=}
jwt.trajanje=${JWT_TRAJANJE:PT8H}

# Decimalni broj u cjelobrojnom polju (npr. "grade": 4.5) je greška 400, a ne tiho skraćivanje na 4.
spring.jackson.deserialization.accept-float-as-int=false

# Folder za slike objava (8.6). Lokalno je relativan; na serveru za predaju postaviti SLIKE_FOLDER
# na trajnu apsolutnu adresu (ili Docker volume) sa pravom pisanja.
pumpd.slike.folder=${SLIKE_FOLDER:uploads/slike}
# Slanje slike (POST /api/posts/images): Spring po defaultu prima najviše 1 MB.
# max-request-size je malo veći, da slika od tačno 5 MB ne bude odbijena zbog ostatka zahtjeva.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Kad je slika prevelika, server pročita ostatak zahtjeva (do 10 MB) prije odgovora 400,
# da telefon dobije poruku o grešci umjesto prekinute veze (Tomcat po defaultu čita samo 2 MB).
server.tomcat.max-swallow-size=10MB
