name: Java CI with Maven

# Backend testovi (jedinični i integracioni, uz provjeru odgovora prema docs/openapi.yaml) na svaki
# push i PR prema develop/main, ali samo kad se mijenja backend ili ovaj fajl.
on:
  push:
    branches: [ "develop", "main" ]
    paths: [ "backend/**", ".github/workflows/ci.yml" ]
  pull_request:
    branches: [ "develop", "main" ]
    paths: [ "backend/**", ".github/workflows/ci.yml" ]

# Novi commit na istom PR-u (ili grani) prekida prethodno pokretanje koje je još u toku.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Integracioni testovi pokreću MySQL u Dockeru (Testcontainers); Docker postoji na ubuntu-latest.
    - name: Build and Test with Maven
      run: ./mvnw -B clean verify
      working-directory: ./backend

    - name: Izvjestaji testova (kad testovi padnu)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: izvjestaji-testova
        path: |
          backend/target/surefire-reports/
          backend/target/openapi-neslaganja.txt
          backend/target/openapi-pokrivenost.txt
        if-no-files-found: ignore
        retention-days: 7
